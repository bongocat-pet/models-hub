name: Publish model packages

on:
  push:
    branches: [main]
    paths:
      - 'data/models.json'
      - 'package.json'
      - 'scripts/package-models.mjs'
      - 'scripts/verify-r2-upload.mjs'
      - '.github/workflows/publish-models.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: models-hub-package-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate R2 configuration
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
        run: |
          : "${AWS_ACCESS_KEY_ID:?Missing R2_ACCESS_KEY_ID repository secret}"
          : "${AWS_SECRET_ACCESS_KEY:?Missing R2_SECRET_ACCESS_KEY repository secret}"
          : "${CLOUDFLARE_ACCOUNT_ID:?Missing CLOUDFLARE_ACCOUNT_ID repository secret}"
          : "${R2_BUCKET_NAME:?Missing R2_BUCKET_NAME repository variable}"
          account_id="${CLOUDFLARE_ACCOUNT_ID#https://}"
          account_id="${account_id%%.*}"
          if [[ ! "$account_id" =~ ^[0-9a-fA-F]{32}$ ]]; then
            echo "::error title=Invalid Cloudflare account ID::CLOUDFLARE_ACCOUNT_ID must be a 32-character account ID or an R2 S3 API URL."
            exit 1
          fi
          echo "R2_ENDPOINT=https://${account_id}.r2.cloudflarestorage.com" >> "$GITHUB_ENV"
          aws --version
      - name: Check R2 bucket access
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
        run: |
          set +e
          result=$(aws s3api list-objects-v2 \
            --bucket "$R2_BUCKET_NAME" \
            --max-keys 1 \
            --endpoint-url "$R2_ENDPOINT" \
            --region auto \
            --query KeyCount 2>&1)
          status=$?
          set -e
          if (( status != 0 )); then
            message="${result//'%'/'%25'}"
            message="${message//$'\r'/'%0D'}"
            message="${message//$'\n'/'%0A'}"
            echo "::error title=R2 bucket access failed::$message"
            exit "$status"
          fi
          echo "$result"
      - name: Build one ZIP per model
        run: npm run package
      - name: Upload packages to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
        run: |
          aws s3 sync r2-assets/models/ "s3://${R2_BUCKET_NAME}/models/" \
            --endpoint-url "$R2_ENDPOINT" \
            --region auto \
            --only-show-errors \
            --content-type application/zip \
            --content-disposition attachment \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 sync release-assets/ "s3://${R2_BUCKET_NAME}/models/" \
            --endpoint-url "$R2_ENDPOINT" \
            --region auto \
            --only-show-errors \
            --content-type application/zip \
            --content-disposition attachment \
            --cache-control "public, max-age=31536000, immutable"
      - name: Verify public R2 downloads
        env:
          R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
        run: npm run verify:r2
      - name: Update stable release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view models >/dev/null 2>&1; then
            gh release create models --title "BongoCat community models" --notes "Automatically synchronized model packages."
          fi
          gh release view models --json assets --jq '.assets[].name' > "$RUNNER_TEMP/published-model-assets.txt"
          for package in release-assets/*.zip; do
            [ -f "$package" ] || continue
            gh release upload models "$package" --clobber
          done
          while IFS= read -r asset; do
            if [ ! -f "release-assets/$asset" ]; then
              # Keep asset names beginning with '-' from being parsed as flags.
              gh release delete-asset models --yes -- "$asset"
            fi
          done < "$RUNNER_TEMP/published-model-assets.txt"

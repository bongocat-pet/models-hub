name: Publish model packages

on:
  push:
    branches: [main]
    paths:
      - 'data/models.json'
      - 'package.json'
      - 'scripts/package-models.mjs'
      - 'scripts/verify-r2-upload.mjs'
      - '.github/workflows/publish-models.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: models-hub-package-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build one ZIP per model
        run: npm run package
      - name: Upload packages to Cloudflare R2
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
        run: |
          : "${AWS_ACCESS_KEY_ID:?Missing R2_ACCESS_KEY_ID repository secret}"
          : "${AWS_SECRET_ACCESS_KEY:?Missing R2_SECRET_ACCESS_KEY repository secret}"
          : "${CLOUDFLARE_ACCOUNT_ID:?Missing CLOUDFLARE_ACCOUNT_ID repository secret}"
          : "${R2_BUCKET_NAME:?Missing R2_BUCKET_NAME repository variable}"
          aws s3 sync release-assets/ "s3://${R2_BUCKET_NAME}/models/" \
            --endpoint-url "https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --region auto \
            --delete \
            --only-show-errors \
            --content-type application/zip \
            --content-disposition attachment \
            --cache-control "public, max-age=31536000, immutable"
      - name: Verify public R2 downloads
        env:
          R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
        run: npm run verify:r2
      - name: Update stable release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view models >/dev/null 2>&1; then
            gh release create models --title "BongoCat community models" --notes "Automatically synchronized model packages."
          fi
          gh release upload models release-assets/*.zip --clobber
          while IFS= read -r asset; do
            if [ ! -f "release-assets/$asset" ]; then
              gh release delete-asset models "$asset" --yes
            fi
          done < <(gh release view models --json assets --jq '.assets[].name')

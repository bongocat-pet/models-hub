name: Publish model packages

on:
  push:
    branches: [main]
    paths:
      - 'data/models.json'
      - 'scripts/package-models.mjs'
      - '.github/workflows/publish-models.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: models-hub-package-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build one ZIP per model
        run: npm run package
      - name: Update stable release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view models >/dev/null 2>&1; then
            gh release create models --title "BongoCat community models" --notes "Automatically synchronized model packages."
          fi
          gh release upload models release-assets/*.zip --clobber
          while IFS= read -r asset; do
            if [ ! -f "release-assets/$asset" ]; then
              gh release delete-asset models "$asset" --yes
            fi
          done < <(gh release view models --json assets --jq '.assets[].name')

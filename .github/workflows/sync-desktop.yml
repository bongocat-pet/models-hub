name: Sync desktop release

on:
  push:
    branches: [main]
    paths:
      - 'scripts/desktop/sync-release.mjs'
      - 'package.json'
      - '.github/workflows/sync-desktop.yml'
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [desktop-release-published]

permissions:
  contents: write

concurrency:
  group: models-hub-desktop-release-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate R2 configuration
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
        run: |
          : "${CLOUDFLARE_ACCOUNT_ID:?Missing CLOUDFLARE_ACCOUNT_ID repository secret}"
          : "${R2_ACCESS_KEY_ID:?Missing R2_ACCESS_KEY_ID repository secret}"
          : "${R2_SECRET_ACCESS_KEY:?Missing R2_SECRET_ACCESS_KEY repository secret}"
          : "${R2_BUCKET_NAME:?Missing R2_BUCKET_NAME repository variable}"
          account_id="${CLOUDFLARE_ACCOUNT_ID#https://}"
          account_id="${account_id%%.*}"
          if [[ ! "$account_id" =~ ^[0-9a-fA-F]{32}$ ]]; then
            echo "::error title=Invalid Cloudflare account ID::CLOUDFLARE_ACCOUNT_ID must be a 32-character account ID or an R2 S3 API URL."
            exit 1
          fi
          echo "R2_ENDPOINT=https://${account_id}.r2.cloudflarestorage.com" >> "$GITHUB_ENV"
      - name: Sync latest GitHub release to R2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
        run: npm run sync:desktop
      - name: Commit manifest changes
        shell: bash
        run: |
          git add data/desktop-releases.json
          if git diff --cached --quiet; then
            echo "Desktop release manifest is already current."
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "chore: sync desktop release manifest"
          git pull --rebase origin main
          git push origin HEAD:main
